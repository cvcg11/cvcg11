name: Generate WakaTime Metrics

on:
  schedule:
    - cron: "0 * * * *"   # Cada hora
  workflow_dispatch:       # Permite ejecutarlo manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # Para commit, NO analiza repos
          filename: metrics.svg
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_sections: time, languages, editors, os
