name: Metrics — Lenguajes + WakaTime

on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔤 Lenguajes (simples)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-langs.svg
          base: ""
          plugin_languages: yes

      - name: 🕒 Lenguajes recientes
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-langs-recent.svg
          base: ""
          plugin_languages: yes
          plugin_languages_recent: yes
          plugin_languages_recent_days: 14

      - name: ⏱️ WakaTime
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-wakatime.svg
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, editors
          plugin_wakatime_user: cvcg11
