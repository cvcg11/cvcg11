name: Generate Complete Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: cvcg11
          repo: cvcg11

          filename: metrics.svg
          committer_branch: main
          committer_message: "Update Metrics"

          # ---------- Template QUE SÍ FUNCIONA ----------
          template: clean

          # ---------- Configuración ----------
          config_timezone: America/El_Salvador
          config_twemoji: yes
          config_animations: yes

          # ---------- Base ----------
          base: header, metadata, repositories

          # ---------- Lenguajes ----------
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          plugin_languages_categories: programming, markup

          # ---------- Actividad ligera ----------
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 7
          plugin_activity_filter: commits

          # ---------- Achievements ----------
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

          # ---------- WakaTime ----------
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_sections: time, languages, editors, os
          plugin_wakatime_days: 7
