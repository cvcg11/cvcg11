name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write     # NECESARIO para que escriba en el README

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          REPOSITORY: cvcg11/cvcg11
          SHOW_TITLE: false
          SECTION_NAME: waka
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TIME: true
          SHOW_TOTAL: true
          BLOCKS: ░▒▓█
          CODE_LANG: txt
          STOP_AT_OTHER: false
          COMMIT_MESSAGE: "Update WakaTime stats"
