name: Metrics — Lenguajes (repos + contribs)

on:
  schedule:
    - cron: "20 */12 * * *"   # corre 2 veces al día
  workflow_dispatch:

permissions:
  contents: write   # para poder commitear los SVG al repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lenguajes (repos + contribuciones)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}     # <- usa el secret, NO pegues el ghp_...
          filename: metrics-langs.svg
          base: ""
          output_action: commit
          committer_branch: main                  # cambia si tu rama por defecto NO es main
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore(metrics): update languages (indepth)"
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css     # opcional
          repositories_forks: no
          repositories_affiliations: owner, collaborator, organization_member

      - name: Lenguajes recientes (por actividad)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-langs-recent.svg
          base: ""
          output_action: commit
          committer_branch: main
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore(metrics): update languages (recent)"
          plugin_languages: yes
          plugin_languages_recent: yes
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 500
          repositories_affiliations: owner, collaborator, organization_member
