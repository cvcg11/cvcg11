name: Metrics — Lenguajes + WakaTime

on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lenguajes (repos + contribuciones)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-langs.svg
          base: ""
          output_action: commit
          committer_branch: main
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore(metrics): update languages (indepth)"
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css
          repositories_forks: no
          repositories_affiliations: owner, collaborator, organization_member

      - name: Lenguajes recientes (por actividad)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-langs-recent.svg
          base: ""
          output_action: commit
          committer_branch: main
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore(metrics): update languages (recent)"
          plugin_languages: yes
          plugin_languages_recent: yes
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 500
          repositories_affiliations: owner, collaborator, organization_member

      - name: WakaTime — Time Tracking
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-wakatime.svg
          base: ""
          output_action: commit
          committer_branch: main
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore(metrics): update wakatime stats"
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, editors, projects
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_user: "cvcg11"
