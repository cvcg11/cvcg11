name: Update WakaTime stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
           WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: "false"
          BLOCKS: ""
          TIME_RANGE: "all_time"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          LANG_COUNT: 4
          BLOCKS: ▰▰▰▱▱
